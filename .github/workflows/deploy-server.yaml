name: Deploy Vue Website

on:
  push:
    branches: [main]
    
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22


    - name: Install
      run: npm install


    - name: Build
      run: npm run build


    - name: Deploy
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_KEY }}

        source: "dist/*"

        target: "/www/wwwroot/t2industry-v2"

        strip_components: 1
